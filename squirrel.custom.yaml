# 鼠须管 0.16.2 皮肤。方案里的同名键会覆盖全局 style/ 的配置
# （SquirrelPanel.m:1440 起），所以几何项写在这下面即可，不必拆到 style。
patch:
  "style/color_scheme": metro
  "style/text_orientation": horizontal
  "style/candidate_list_layout": linear
  "preset_color_schemes/metro":
    name: "metro"
    author: "flypy.com"
    back_color: 0xffffff
    text_color: 0x333333
    hilited_text_color: 0x000000
    hilited_back_color: 0xffffff
    candidate_text_color: 0x000000
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0xe89f00
    label_color: 0x555555
    hilited_candidate_label_color: 0xeeeeee
    comment_text_color: 0x555555
    hilited_comment_text_color: 0xcccccc
    font_point: 18
    label_font_point: 18
    # 编号与候选之间用 1/6 em 空格分隔；只在 0.16 的 candidate_format 里有效
    candidate_format: "%c\u2005%@\u2005"
    inline_preedit: true
    corner_radius: 6
    border_width: 8
    border_height: 8
  "app_options":
    com.microsoft.VSCode:
      ascii_mode: false  # 初始爲西文模式
      vim_mode: false    # 退出VIM插入模式自動切換輸入法狀態
    com.google.Chrome:
      # 規避 https://github.com/rime/squirrel/issues/435
      inline: true
    ru.keepcoder.Telegram:
      # 規避 https://github.com/rime/squirrel/issues/475
      inline: true
