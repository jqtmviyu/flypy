patch:
  schema_list:
    - schema: flypy

  switcher/hotkeys: []

  # Caps Lock 只切换大小写，不做中英切换
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Caps_Lock: noop
    # noop: 关闭shift中文切换;commit_code 开启
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
