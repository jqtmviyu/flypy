customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "Weasel::UIStyleSettings"
  rime_version: 1.13.1
patch:
  # 对齐 macOS 的 squirrel.custom.yaml：正文 18pt、编号 14pt、6px 圆角、8px 白边
  "style/color_scheme": metro
  "style/horizontal": true
  "style/inline_preedit": true
  "style/font_face": "Microsoft YaHei"
  "style/font_point": 14
  "style/label_font_face": "Microsoft YaHei"
  "style/label_font_point": 14
  "style/comment_font_point": 14
  "style/label_format": "%s "

  # Squirrel 用 border_width/height: 8 撑白边，小狼毫用外边距等效。
  # corner_radius 是窗口圆角，round_corner 只管首选高亮块，两个都要设。
  "style/layout/border_width": 0
  "style/layout/margin_x": 8
  "style/layout/margin_y": 8
  "style/layout/corner_radius": 6
  "style/layout/round_corner": 0
  "style/layout/candidate_spacing": 14
  "style/layout/hilite_padding": 8
  "style/layout/hilite_spacing": 4
  "style/layout/spacing": 10
  "style/layout/shadow_radius": 8
  "style/layout/shadow_offset_x": 2
  "style/layout/shadow_offset_y": 2
  "style/layout/min_width": 0
  "style/layout/min_height": 0

  # 配色与 Mac 逐项相同。shadow_color 属于配色方案而不是 layout，
  # 0x40 是透明度，不放这里就没有阴影。
  "preset_color_schemes/metro":
    name: "metro"
    author: "flypy.com"
    back_color: 0xffffff
    shadow_color: 0x40000000
    border_color: 0xffffff
    text_color: 0x333333
    hilited_text_color: 0x000000
    hilited_back_color: 0xffffff
    candidate_text_color: 0x000000
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0xe89f00
    label_color: 0x555555
    hilited_label_color: 0xeeeeee
    comment_text_color: 0x555555
    hilited_comment_text_color: 0xcccccc
